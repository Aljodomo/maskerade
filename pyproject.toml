[project]
name = "maskerade"
version = "0.1.0"
description = "Privacy-preserving text anonymisation library designed for LLM pipelines and privacy-sensitive workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datafog[all]>=4.4.0",
    "fastcoref>=2.1.6",
    "pydantic>=2.13.4",
    "torch>=2.6.0",
    "transformers>=5.8.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
